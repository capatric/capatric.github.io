---
layout: default
---

<article class="page-shell">
    <header class="page-header">
        <p class="eyebrow">{{ page.eyebrow | default: 'Profile' }}</p>
        <h1>{{ page.title }}</h1>
        {% if page.intro %}
        <p class="page-intro">{{ page.intro }}</p>
        {% endif %}
    </header>

    <div class="page-content">
        {{ content }}
    </div>
</article>
